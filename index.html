<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EquipBase</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-4">
	<div id="container" class="grid grid-cols-2 md:grid-cols-6 gap--2 bg-white p-2 rounded-lg"></div>
	<pre id="output" class="mt-4 p-2 bg-black text-white font-black rounded-lg whitespace-pre-wrap"></pre>
	<script>
		const URL = "https://cdnrepo.github.io/EquipBase.json";
		let data = {};
		let state = {};
		async function loadData() {
			const res = await fetch(URL);
			data = await res.json();
			renderUI();
			renderOutput();
		}
		function renderUI() {
			const container = document.getElementById("container");
			container.innerHTML = "";
			Object.keys(data).forEach(key => {
				const value = data[key];
						    <!-- if (value === "-1") return; -->
				state[key] = -1;
				
				if (value === "-1" || value === -1) return;

				
				
							const wrap = document.createElement("label");
							    <!-- const isDisabled = value === "-1"; -->
							wrap.className = "flex items-center space-x-2 cursor-pointer";
							const cb = document.createElement("input");
							cb.type = "checkbox";
							cb.className = "w-4 h-4";
							const text = document.createElement("span");
							text.textContent = `${key} * ${data[key]}`;
							text.className = "transition";
							cb.onchange = () => {
								state[key] = cb.checked ? 1 : -1;
								// đổi màu nếu != -1
								if (state[key] !== -1) {
									text.classList.add("text-green-500", "font-medium");
								} else {
									text.classList.remove("text-green-500", "font-medium");
								}
								renderOutput();
							};
				wrap.appendChild(cb);
				wrap.appendChild(text);
				container.appendChild(wrap);
			});
		}
		function renderOutput() {
			const output = Object.keys(data)
				.map(k => state[k])
				.join("\t");
			document.getElementById("output").textContent = output;
		}
		loadData();
	</script>
</body>
</html>
