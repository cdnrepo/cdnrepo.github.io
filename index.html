<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EquipBase</title>
	<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-200 text-black p-2 space-y-2" style="font-family: 'Oswald', sans-serif;">
	<div id="container" class="grid grid-cols-2 sm:grid-cols-7 bg-white p-2 rounded-lg"></div>
	<pre id="output" class="p-2 rounded-lg bg-black text-white whitespace-pre-wrap"></pre>
	<script>
		const URL = "https://cdnrepo.github.io/EquipBase.json";
		let data = {};
		let state = {};
		async function loadData() {
			const res = await fetch(URL);
			data = await res.json();
			renderUI();
			renderOutput();
		}
		function renderUI() {
			const container = document.getElementById("container");
			container.innerHTML = "";
			Object.keys(data).forEach(key => {
				const value = data[key];
				state[key] = -1;
				if (value === "-1" || value === -1) return;
				const wrap = document.createElement("label");
				wrap.className = "flex items-center space-x-2 cursor-pointer";
				const cb = document.createElement("input");
				cb.type = "checkbox";
				cb.className = "w-3 h-3";
				const text = document.createElement("span");
				text.textContent = `${key}: ${data[key]}`;
				text.className = "transition";
				cb.onchange = () => {
					state[key] = cb.checked ? 1 : -1;
					if (state[key] !== -1) {
						text.classList.add("text-green-600");
					} else {
						text.classList.remove("text-green-600");
					}
					renderOutput();
				};
				wrap.appendChild(cb);
				wrap.appendChild(text);
				container.appendChild(wrap);
			});
		}
		function renderOutput() {
			const output = Object.keys(data)
				.map(k => state[k])
				.join("\t");
			document.getElementById("output").textContent = output;
		}
		loadData();
	</script>
</body>
</html>
